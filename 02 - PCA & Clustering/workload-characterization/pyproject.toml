description = ""
authors = [
    {name = "antsiri",email = "antoniosirignano@outlook.it"}
]
requires-python = ">=3.13"
dependencies = [
    "fastapi (>=0.141.1,<0.142.0)",
    "psutil (>=7.2.2,<8.0.0)",
    "uvicorn (>=0.52.4,<0.53.0)",
    "requests (>=2.34.2,<3.0.0)",
    "pandas (>=3.0.5,<4.0.0)",
    "matplotlib (>=3.11.1,<4.0.0)",
