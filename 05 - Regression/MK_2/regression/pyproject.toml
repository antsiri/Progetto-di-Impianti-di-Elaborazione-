[project]
name = "regression"
version = "0.1.0"
description = "HomeWork Regression: OLS, normalità dei residui (KSL), trend (tau di Kendall), Theil-Sen e failure prediction"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "matplotlib>=3.7",
    "numpy>=1.24",
    "pandas>=2.2",
    "scipy>=1.10",
    "statsmodels>=0.14",
    "python-calamine>=0.2",  # lettore Excel (.xls/.xlsx) usato da pandas
]

[project.scripts]
regression = "regression.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/regression"]

[tool.pytest.ini_options]
testpaths = ["tests"]